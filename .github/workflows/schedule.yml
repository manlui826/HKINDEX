name: HSI Daily Auto Fetcher

on:
  schedule:
    # Triggers every Monday through Friday at 17:15 (5:15 PM) Hong Kong Time
    - cron: '15 9 * * 1-5'
  workflow_dispatch: # Keeps a manual "Run" button active for testing

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the runner permission to save the CSV back to your repo
    steps:
    - name: Check out repo code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: pip install yfinance pandas

    - name: Fetch HSI Data
      run: python fetch_hsi.py

    - name: Save CSV back to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add hsi_historical_data.csv
        git commit -m "Automated HSI Data Sync" || exit 0
        git push
