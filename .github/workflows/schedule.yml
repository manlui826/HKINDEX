name: HSI Daily Auto Fetcher

on:
  schedule:
    - cron: '16 16 * * 1-5' # Runs at 10:15 UTC (18:15 HKT) Monday to Friday
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly grants write access
    steps:
    - name: Check out repo code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas openpyxl

    - name: Fetch HSI Data
      run: python fetch_hsi.py

    - name: Save Excel back to Repository
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Pull latest changes to avoid conflicts
        git pull origin main --rebase
        
        # Stage only changes, check if file exists
        git add *.xlsx
        
        # Commit only if files changed
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated HSI Data Sync $(date +'%Y-%m-%d')"
          git push origin main
        fi
